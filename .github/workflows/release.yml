# Tag-triggered release workflow: build platform-specific VSIXs
# bundling two native binaries from ontologyportal/sigma-rs:
#
#   * `sumo-lsp` -- the language server (hover, goto, completion,
#     diagnostics, taxonomy).  Always spawned on activation.
#   * `sumo`     -- the ask/tell kernel (the `sumo serve`
#     subcommand).  Lazily spawned on the first ask/tell.
#
# Triggering:
#   - Push a tag matching `sumo-vscode-vA.B.C` to cut a release.
#     The workflow auto-detects the latest sumo-lsp-vX.Y.Z and
#     sigmakee-vX.Y.Z releases from sigma-rs and bundles them.
#   - Use `workflow_dispatch` for manual/test builds, with optional
#     version overrides for either binary.
#
# Platform matrix targets: darwin-arm64, linux-x64, win32-x64.
# darwin-x64 is omitted -- no upstream sumo-lsp binary exists for it.
#
# Vampire is *not* bundled; it is an external dependency.

name: Release platform-specific VSIXs

on:
  push:
    tags:
      - 'sumo-vscode-v*'
  workflow_dispatch:
    inputs:
      lsp_version:
        description: 'sumo-lsp version to bundle (e.g. 0.1.0). Leave empty for latest.'
        required: false
        default: ''
      kernel_version:
        description: 'sigmakee version to bundle (e.g. 1.0.0). Leave empty for latest.'
        required: false
        default: ''
      publish_marketplace:
        description: 'Also publish the built VSIXs to the VS Code Marketplace.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # create / upload release assets

env:
  SIGMA_RS_REPO: "ontologyportal/sigma-rs"

jobs:
  # -----------------------------------------------------------------------
  # Resolve which upstream binary versions to bundle.  Runs once and fans
  # out to the platform matrix so we only hit the GitHub API once.
  # -----------------------------------------------------------------------
  resolve-versions:
    name: Resolve binary versions
    runs-on: ubuntu-latest
    outputs:
      lsp_version:    ${{ steps.resolve.outputs.lsp_version }}
      kernel_version: ${{ steps.resolve.outputs.kernel_version }}
    steps:
      - name: Resolve latest sumo-lsp and sigmakee releases
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.lsp_version }}" ]]; then
            LSP_VERSION="${{ inputs.lsp_version }}"
          else
            LSP_TAG=$(gh release list --repo "$SIGMA_RS_REPO" --limit 50 --json tagName \
              | jq -r '[.[].tagName | select(startswith("sumo-lsp-v"))] | .[0]')
            LSP_VERSION="${LSP_TAG#sumo-lsp-v}"
          fi

          if [[ -n "${{ inputs.kernel_version }}" ]]; then
            KERNEL_VERSION="${{ inputs.kernel_version }}"
          else
            KERNEL_TAG=$(gh release list --repo "$SIGMA_RS_REPO" --limit 50 --json tagName \
              | jq -r '[.[].tagName | select(startswith("sigmakee-v"))] | .[0]')
            KERNEL_VERSION="${KERNEL_TAG#sigmakee-v}"
          fi

          echo "sumo-lsp version : ${LSP_VERSION}"
          echo "sigmakee version : ${KERNEL_VERSION}"
          echo "lsp_version=${LSP_VERSION}"       >> "$GITHUB_OUTPUT"
          echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Build one VSIX per platform.
  # -----------------------------------------------------------------------
  build:
    name: build / ${{ matrix.vsce-target }}
    needs: resolve-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsce-target:  darwin-arm64
            asset-suffix: darwin-arm64.tar.gz
            lsp-binary:   sumo-lsp
            kernel-binary: sumo
          - vsce-target:  linux-x64
            asset-suffix: linux-x64-gnu.tar.gz
            lsp-binary:   sumo-lsp
            kernel-binary: sumo
          - vsce-target:  win32-x64
            asset-suffix: win32-x64.zip
            lsp-binary:   sumo-lsp.exe
            kernel-binary: sumo.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download and stage binaries
        env:
          GH_TOKEN: ${{ github.token }}
          LSP_VERSION:    ${{ needs.resolve-versions.outputs.lsp_version }}
          KERNEL_VERSION: ${{ needs.resolve-versions.outputs.kernel_version }}
        # Downloads sumo-lsp and the sigmakee kernel for this platform,
        # verifies each SHA-256 sidecar, and stages into server/.
        # Asset filenames match the sigma-rs release convention:
        #   sumo-lsp-{ver}-{platform}.{ext}   (tag: sumo-lsp-v{ver})
        #   sumo-{ver}-{platform}.{ext}        (tag: sigmakee-v{ver})
        run: |
          set -euo pipefail

          # fetch_and_stage TAG_PREFIX VERSION ASSET_PREFIX BIN_NAME
          #   TAG_PREFIX   -- e.g. 'sumo-lsp' or 'sigmakee'
          #   VERSION      -- e.g. '0.1.0'
          #   ASSET_PREFIX -- e.g. 'sumo-lsp' or 'sumo'
          #   BIN_NAME     -- filename of the binary inside the archive
          fetch_and_stage() {
            local tag_prefix="$1"
            local version="$2"
            local asset_prefix="$3"
            local bin_name="$4"
            local suffix="${{ matrix.asset-suffix }}"

            local tag="${tag_prefix}-v${version}"
            local asset="${asset_prefix}-${version}-${suffix}"
            local base_url="https://github.com/${SIGMA_RS_REPO}/releases/download/${tag}"

            echo "Downloading ${base_url}/${asset}"
            curl --fail --location --output "${asset}"        "${base_url}/${asset}"
            curl --fail --location --output "${asset}.sha256" "${base_url}/${asset}.sha256"

            sha256sum -c --ignore-missing "${asset}.sha256"

            local srcdir="${asset%.tar.gz}"
            srcdir="${srcdir%.zip}"

            case "${asset}" in
              *.tar.gz) tar -xzf "${asset}" ;;
              *.zip)    unzip -q  "${asset}" ;;
            esac

            mkdir -p server
            cp "${srcdir}/${bin_name}" "server/${bin_name}"
            chmod +x "server/${bin_name}" || true
          }

          fetch_and_stage "sumo-lsp" "${LSP_VERSION}"    "sumo-lsp" "${{ matrix.lsp-binary }}"
          fetch_and_stage "sigmakee" "${KERNEL_VERSION}" "sumo"     "${{ matrix.kernel-binary }}"
          ls -lh server/

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: npx --no vsce package --target ${{ matrix.vsce-target }}

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce-target }}
          path: '*.vsix'
          retention-days: 30

      - name: Attach VSIX to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          draft: false
          generate_release_notes: true

  # -----------------------------------------------------------------------
  # Publish each platform-specific VSIX to the VS Code Marketplace.
  #
  # Runs once after every platform has built so a partial-publish (one
  # platform succeeded, another failed mid-matrix) can't leave the
  # Marketplace in an inconsistent state.  Triggered automatically on
  # tag pushes, and opt-in for `workflow_dispatch` via the
  # `publish_marketplace` input -- no surprise publishes from manual
  # test builds.
  #
  # Requires a repository secret `VSCE_PAT` containing a Personal
  # Access Token from Azure DevOps with the `Marketplace > Manage`
  # scope.  See:
  #   https://code.visualstudio.com/api/working-with-extensions/publishing-extension#get-a-personal-access-token
  #
  # The VSIXs are published as-is (already platform-targeted via
  # `vsce package --target`); `vsce publish --packagePath` skips the
  # repackage step and uploads the artefact verbatim.
  # -----------------------------------------------------------------------
  publish-marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish_marketplace }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify VSCE_PAT is configured
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "${VSCE_PAT}" ]]; then
            echo "::error::Repository secret VSCE_PAT is not set."
            echo "Create a PAT at https://dev.azure.com/<org>/_usersSettings/tokens"
            echo "with Marketplace > Manage scope, then add it as VSCE_PAT in"
            echo "repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Download all platform VSIXs
        uses: actions/download-artifact@v4
        with:
          path: vsixes
          pattern: vsix-*
          merge-multiple: true

      - name: Publish each VSIX to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # vsce publishes one platform-specific package per call.  We
        # publish all three; the Marketplace dedupes by version+target
        # so a re-run of a tag is a no-op rather than an error.
        run: |
          set -euo pipefail
          shopt -s nullglob
          vsixes=(vsixes/*.vsix)
          if [[ ${#vsixes[@]} -eq 0 ]]; then
            echo "::error::No VSIX artifacts were downloaded."
            exit 1
          fi
          for vsix in "${vsixes[@]}"; do
            echo "::group::Publishing ${vsix}"
            npx --no vsce publish --pat "${VSCE_PAT}" --packagePath "${vsix}"
            echo "::endgroup::"
          done
